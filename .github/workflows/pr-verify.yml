name: PR Verify

# 触发条件：向 develop / master 开 PR 或更新 PR 时自动跑，支持手动触发
# 只构建和测试，不发布、不用任何 secret
on:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

# 同一个 PR 有新推送时取消上一次还在跑的校验
concurrency:
  group: pr-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:

    runs-on: ubuntu-latest

    permissions:
      contents: read    # 只读取仓库内容

    steps:
      # 1. 检出代码（PR 事件下默认是 PR 与目标分支的 merge ref）
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Java 17 环境并启用 Maven 缓存
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'      # 自动缓存 Maven 依赖

      # 3. 构建并跑测试与 JaCoCo 覆盖率门
      - name: Maven verify
        run: mvn -B verify
